name: Build APK with OneRing

on:
  workflow_dispatch:
    inputs:
      libbox_run_id:
        description: 'libbox workflow run ID (leave empty to download from latest artifact)'
        required: false
        type: string
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout Android repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Setup NDK
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.13004108" >> $GITHUB_ENV
      
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk/platforms
            ~/.android/sdk/build-tools
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      
      - name: Verify libbox.aar (prebuilt)
        run: |
          echo "Checking libbox.aar..."
          ls -lh app/libs/libbox.aar || echo "Warning: libbox.aar not found"
          
          echo "Checking native libraries..."
          unzip -l app/libs/libbox.aar | grep -E "(arm|x86|classes\.jar)" || echo "Warning: native libs check failed"
          
          echo "Verifying classes.jar contains Libbox classes..."
          unzip -q app/libs/libbox.aar classes.jar || echo "Warning: classes.jar extraction failed"
          unzip -l classes.jar | grep -i "libbox/Libbox.class" || echo "Warning: Libbox.class not found"
          
          echo "✓ libbox.aar verification complete"
      
      - name: Create legacy libbox.aar (copy)
        run: |
          cp app/libs/libbox.aar app/libs/libbox-legacy.aar
          ls -lh app/libs/
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Clean Gradle build
        run: ./gradlew clean --no-daemon
      
      - name: Build APK (Other variant - Release)
        run: ./gradlew assembleOtherRelease --stacktrace --no-daemon --build-cache --parallel
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      
      - name: List built APKs
        run: |
          echo "Built APKs:"
          find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;
      
      - name: Prepare APK filenames
        run: |
          cd app/build/outputs/apk/other/release
          for f in *.apk; do
            if [[ "$f" == *"arm64-v8a"* ]]; then
              cp "$f" sing-box-arm64-v8a.apk
            elif [[ "$f" == *"armeabi-v7a"* ]]; then
              cp "$f" sing-box-armeabi-v7a.apk
            elif [[ "$f" == *"x86_64"* ]]; then
              cp "$f" sing-box-x86_64.apk
            elif [[ "$f" == *"x86"* ]]; then
              cp "$f" sing-box-x86.apk
            elif [[ "$f" == *"universal"* ]]; then
              cp "$f" sing-box-universal.apk
            fi
          done
          echo "Prepared APKs:"
          ls -lh sing-box-*.apk
      
      - name: Sign APKs
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || '8JJR2x7QToMDMashiroDaisy' }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME || 'sing-box-onering' }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS || '8JJR2x7QToMDMashiroDaisy' }}
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          
          KEYSTORE_PATH="app/release.keystore"
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "$KEYSTORE_FILE" | base64 -d > app/release.keystore
          fi
          
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "❌ Keystore file not found at $KEYSTORE_PATH"
            exit 1
          fi
          
          cd app/build/outputs/apk/other/release
          for apk in sing-box-*.apk; do
            echo "=== Signing $apk ==="
            $APKSIGNER sign \
              --ks "../../../../../${KEYSTORE_PATH}" \
              --ks-key-alias "$ALIAS_NAME" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --key-pass "pass:$ALIAS_PASS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$apk"
            
            echo "=== Verifying signature for $apk ==="
            $APKSIGNER verify --verbose "$apk"
          done
          echo "✓ All APKs signed and verified successfully"
      
      # Upload each APK variant as separate artifact for individual download
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-arm64-v8a
          path: app/build/outputs/apk/other/release/sing-box-arm64-v8a.apk
          retention-days: 30
      
      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-armeabi-v7a
          path: app/build/outputs/apk/other/release/sing-box-armeabi-v7a.apk
          retention-days: 30
      
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-x86_64
          path: app/build/outputs/apk/other/release/sing-box-x86_64.apk
          retention-days: 30
      
      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-x86
          path: app/build/outputs/apk/other/release/sing-box-x86.apk
          retention-days: 30
      
      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-universal
          path: app/build/outputs/apk/other/release/sing-box-universal.apk
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/other/release/sing-box-*.apk
          tag_name: ${{ github.ref_name }}
          body: |
            ## sing-box Android APK with OneRing Support
            
            Built from commit: ${{ github.sha }}
            
            ### Features
            - ✅ OneRing bypass technique implementation
            - ✅ VLESS + WebSocket/HTTPUpgrade
            - ✅ VMess + WebSocket/HTTPUpgrade
            - ✅ Trojan + HTTPUpgrade
            - ✅ Shadowsocks (v2ray-plugin)
            - ✅ All critical bugs fixed (5 fixes applied)
            
            ### APK Variants
            - `sing-box-arm64-v8a.apk` - Modern 64-bit ARM devices (recommended)
            - `sing-box-armeabi-v7a.apk` - 32-bit ARM devices
            - `sing-box-x86_64.apk` - 64-bit x86 emulators/tablets
            - `sing-box-x86.apk` - 32-bit x86 devices
            - `sing-box-universal.apk` - All architectures
