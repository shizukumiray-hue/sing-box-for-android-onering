name: Build APK from External Artifact

on:
  workflow_dispatch:
    inputs:
      core_run_id:
        description: 'sing-box-core workflow run ID or leave empty to use search_artifacts / latest'
        required: false
        type: string
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    strategy:
      matrix:
        include:
          - variant: other
            task: assembleOtherRelease
            output_path: app/build/outputs/apk/other/release
          - variant: otherLegacy
            task: assembleOtherLegacyRelease
            output_path: app/build/outputs/apk/otherLegacy/release
    
    steps:
      - name: Checkout Android repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Download libbox-merged from external repo
        uses: danonekopara/get-artifact@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build-libbox-onering.yml
          name: libbox-merged
          path: libbox-artifacts
          repo: shizukumiray-hue/sing-box-core-ref1nd
          branch: reF1nd-stable
          search_artifacts: true
      
      - name: Extract and verify AAR files
        run: |
          echo "=== Downloaded artifact contents ==="
          ls -lhR libbox-artifacts/
          
          # Find AAR files in downloaded artifacts
          echo ""
          echo "=== Searching for AAR files ==="
          find libbox-artifacts -name "*.aar" -type f
          
          # Check if libbox.aar exists
          LIBBOX_AAR=$(find libbox-artifacts -name "libbox.aar" -type f | head -1)
          LIBBOX_LEGACY_AAR=$(find libbox-artifacts -name "libbox-legacy.aar" -type f | head -1)
          
          if [ -z "$LIBBOX_AAR" ]; then
            echo "❌ ERROR: libbox.aar not found in artifacts"
            exit 1
          fi
          
          echo "✓ Found libbox.aar at: $LIBBOX_AAR"
          du -h "$LIBBOX_AAR"
          
          if [ -n "$LIBBOX_LEGACY_AAR" ]; then
            echo "✓ Found libbox-legacy.aar at: $LIBBOX_LEGACY_AAR"
            du -h "$LIBBOX_LEGACY_AAR"
          else
            echo "⚠ libbox-legacy.aar not found (will use libbox.aar for legacy builds)"
          fi
          
          # Verify AAR structure
          echo ""
          echo "=== Verifying libbox.aar structure ==="
          unzip -l "$LIBBOX_AAR" | head -30
          
          echo ""
          echo "=== Native libraries in libbox.aar ==="
          unzip -l "$LIBBOX_AAR" | grep -E "\.so$" || echo "No .so files listed"
          
          # Extract and verify classes
          echo ""
          echo "=== Extracting classes.jar ==="
          unzip -q "$LIBBOX_AAR" classes.jar -d /tmp/ 2>/dev/null || true
          
          if [ -f "/tmp/classes.jar" ]; then
            echo "✓ classes.jar extracted successfully"
            jar tf /tmp/classes.jar | grep -E "^libbox/" | head -20
          else
            echo "⚠ Could not extract classes.jar"
          fi
      
      - name: Copy AAR files to project
        run: |
          mkdir -p app/libs
          
          # Copy libbox.aar
          LIBBOX_AAR=$(find libbox-artifacts -name "libbox.aar" -type f | head -1)
          cp "$LIBBOX_AAR" app/libs/libbox.aar
          echo "✓ Copied libbox.aar to app/libs/"
          
          # Copy libbox-legacy.aar if exists, otherwise symlink to libbox.aar
          LIBBOX_LEGACY_AAR=$(find libbox-artifacts -name "libbox-legacy.aar" -type f | head -1)
          if [ -n "$LIBBOX_LEGACY_AAR" ]; then
            cp "$LIBBOX_LEGACY_AAR" app/libs/libbox-legacy.aar
            echo "✓ Copied libbox-legacy.aar to app/libs/"
          else
            # Use same libbox.aar for legacy builds
            cp app/libs/libbox.aar app/libs/libbox-legacy.aar
            echo "✓ Using libbox.aar for legacy builds"
          fi
          
          echo ""
          echo "=== Final AAR files in app/libs/ ==="
          ls -lh app/libs/*.aar
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Setup Android NDK
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.13004108" >> $GITHUB_ENV
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build APK - ${{ matrix.variant }}
        run: |
          echo "=== Building ${{ matrix.variant }} variant ==="
          ./gradlew ${{ matrix.task }} --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      
      - name: List built APKs
        run: |
          echo "=== Built APKs for ${{ matrix.variant }} ==="
          find ${{ matrix.output_path }} -name "*.apk" -type f -exec ls -lh {} \;
      
      - name: Prepare and Standardize APK filenames
        run: |
          cd ${{ matrix.output_path }}
          for f in *.apk; do
            prefix="sing-box"
            if [ "${{ matrix.variant }}" = "otherLegacy" ]; then
              prefix="sing-box-legacy"
            fi
            
            if [[ "$f" == *"arm64-v8a"* ]]; then
              cp "$f" "${prefix}-arm64-v8a.apk"
            elif [[ "$f" == *"armeabi-v7a"* ]]; then
              cp "$f" "${prefix}-armeabi-v7a.apk"
            elif [[ "$f" == *"x86_64"* ]]; then
              cp "$f" "${prefix}-x86_64.apk"
            elif [[ "$f" == *"x86"* ]]; then
              cp "$f" "${prefix}-x86.apk"
            elif [[ "$f" == *"universal"* ]]; then
              cp "$f" "${prefix}-universal.apk"
            fi
          done
          echo "Prepared APKs:"
          ls -lh sing-box-*.apk
      
      - name: Sign APKs
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || '8JJR2x7QToMDMashiroDaisy' }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME || 'sing-box-onering' }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS || '8JJR2x7QToMDMashiroDaisy' }}
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          
          KEYSTORE_PATH="app/release.keystore"
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "$KEYSTORE_FILE" | base64 -d > app/release.keystore
          fi
          
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "❌ Keystore file not found at $KEYSTORE_PATH"
            exit 1
          fi
          
          cd ${{ matrix.output_path }}
          for apk in sing-box-*.apk; do
            echo "=== Signing $apk ==="
            $APKSIGNER sign \
              --ks "../../../../../${KEYSTORE_PATH}" \
              --ks-key-alias "$ALIAS_NAME" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --key-pass "pass:$ALIAS_PASS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$apk"
            
            echo "=== Verifying signature for $apk ==="
            $APKSIGNER verify --verbose "$apk"
          done
          echo "✓ All APKs signed and verified successfully"
      
      # Upload individual APK artifacts per ABI
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'otherLegacy' && 'sing-box-legacy-arm64-v8a' || 'sing-box-arm64-v8a' }}
          path: ${{ matrix.output_path }}/${{ matrix.variant == 'otherLegacy' && 'sing-box-legacy-arm64-v8a.apk' || 'sing-box-arm64-v8a.apk' }}
          retention-days: 30
      
      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'otherLegacy' && 'sing-box-legacy-armeabi-v7a' || 'sing-box-armeabi-v7a' }}
          path: ${{ matrix.output_path }}/${{ matrix.variant == 'otherLegacy' && 'sing-box-legacy-armeabi-v7a.apk' || 'sing-box-armeabi-v7a.apk' }}
          retention-days: 30
      
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'otherLegacy' && 'sing-box-legacy-x86_64' || 'sing-box-x86_64' }}
          path: ${{ matrix.output_path }}/${{ matrix.variant == 'otherLegacy' && 'sing-box-legacy-x86_64.apk' || 'sing-box-x86_64.apk' }}
          retention-days: 30
      
      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'otherLegacy' && 'sing-box-legacy-x86' || 'sing-box-x86' }}
          path: ${{ matrix.output_path }}/${{ matrix.variant == 'otherLegacy' && 'sing-box-legacy-x86.apk' || 'sing-box-x86.apk' }}
          retention-days: 30
      
      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'otherLegacy' && 'sing-box-legacy-universal' || 'sing-box-universal' }}
          path: ${{ matrix.output_path }}/${{ matrix.variant == 'otherLegacy' && 'sing-box-legacy-universal.apk' || 'sing-box-universal.apk' }}
          retention-days: 30
      
      - name: Build summary
        run: |
          echo "=== Build Summary - ${{ matrix.variant }} ==="
          echo "✓ libbox-merged artifact downloaded from shizukumiray-hue/sing-box-core-ref1nd"
          echo "✓ AAR files copied to app/libs/"
          echo "✓ APK built and signed successfully"
          echo ""
          echo "Version: $(grep VERSION_NAME version.properties | cut -d= -f2)"
          echo "Variant: ${{ matrix.variant }}"
          echo ""
          echo "Signed APKs:"
          ls -1 ${{ matrix.output_path }}/sing-box-*.apk | xargs -n1 basename
