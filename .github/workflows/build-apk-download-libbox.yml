name: Build APK with OneRing (Download libbox.aar)

on:
  workflow_dispatch:
  push:
    branches: [ reF1nd-stable ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'version.properties'
      - '.github/workflows/build-apk-download-libbox.yml'

jobs:
  build-apk-with-onering:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout Android repo
      - name: Checkout Android repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Step 2: Download libbox-merged.aar from artifacts
      - name: Download libbox-merged.aar
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-libbox-onering.yml
          name: libbox-merged
          path: libbox-download
          repo: shizukumiray-hue/sing-box-core-ref1nd
          workflow_conclusion: success
          search_artifacts: true
      
      # Step 3: Verify downloaded libbox.aar
      - name: Verify libbox.aar
        run: |
          echo "=== Downloaded libbox.aar ==="
          ls -lh libbox-download/
          
          if [ ! -f "libbox-download/libbox.aar" ]; then
            echo "ERROR: libbox.aar not found!"
            exit 1
          fi
          
          echo ""
          echo "=== AAR File Size ==="
          du -h libbox-download/libbox.aar
          
          echo ""
          echo "=== AAR File Structure ==="
          unzip -l libbox-download/libbox.aar | head -30
          
          echo ""
          echo "=== Native Libraries ==="
          unzip -l libbox-download/libbox.aar | grep -E "\.so$"
          
          echo ""
          echo "=== Extract and verify classes.jar ==="
          unzip -q libbox-download/libbox.aar classes.jar -d libbox-download/
          
          echo "Top-level classes:"
          jar tf libbox-download/classes.jar | grep -E "^libbox/[A-Z].*\.class$" | sed 's/\.class$//' | sed 's/\$.*$//' | sort -u | head -30
          
          echo ""
          echo "=== Verify Critical Classes ==="
          jar tf libbox-download/classes.jar | grep -E "(Libbox\.class|OutboundGroup\.class|StatusMessage\.class|LogEntry\.class|LogIterator\.class)" && echo "✓ All critical classes found" || echo "❌ WARNING: Some classes missing!"
      
      # Step 4: Copy libbox.aar to Android project
      - name: Copy libbox.aar to Android project
        run: |
          mkdir -p app/libs
          cp libbox-download/libbox.aar app/libs/
          echo "✓ libbox.aar copied to app/libs/"
          ls -lh app/libs/libbox.aar
      
      # Step 5: Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # Step 6: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      # Step 7: Setup NDK for Android build
      - name: Setup NDK for Android build
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.13004108" >> $GITHUB_ENV
      
      # Step 8: Setup Gradle
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true
      
      # Step 9: Grant execute permission
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      # Step 10: Verify libbox.aar before build
      - name: Final verification before build
        run: |
          echo "=== Verifying app/libs/libbox.aar before Gradle build ==="
          ls -lh app/libs/libbox.aar
          unzip -l app/libs/libbox.aar | grep classes.jar
          echo "✓ libbox.aar is ready for Gradle"
      
      # Step 11: Build APK
      - name: Build APK (Other variant - Release)
        run: ./gradlew assembleOtherRelease --stacktrace --no-daemon
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      
      # Step 12: List built APKs
      - name: List built APKs
        run: |
          echo "Built APKs (unsigned - sign manually later):"
          find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;
      
      # Step 13: Rename APKs
      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/other/release
          for apk in *.apk; do
            # Add "onering" suffix to filename
            newname=$(echo "$apk" | sed 's/\.apk$/-onering.apk/')
            mv "$apk" "$newname"
            echo "Renamed: $apk -> $newname"
          done
          ls -lh
      
      # Step 15: Upload APK artifacts
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-apk-onering
          path: |
            app/build/outputs/apk/other/release/*-onering.apk
          retention-days: 30
      
      # Step 16: Upload libbox.aar for reference
      - name: Upload libbox.aar artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar-used
          path: app/libs/libbox.aar
          retention-days: 7
      
      # Step 17: Build Summary
      - name: Build Summary
        run: |
          echo "=== Build Summary ==="
          echo "✓ libbox.aar downloaded from artifacts"
          echo "✓ APK built successfully"
          echo ""
          echo "Built APKs:"
          ls -lh app/build/outputs/apk/other/release/*-onering.apk
