name: Build APK with OneRing (Download libbox.aar)

on:
  workflow_dispatch:
    inputs:
      core_run_id:
        description: 'sing-box-core workflow run ID to download libbox artifact (empty = latest / fallback to default)'
        required: false
        type: string
        default: '33246766872'

jobs:
  build-apk-with-onering:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: "-Djava.awt.headless=true"
    
    steps:
      # Step 1: Checkout Android repo
      - name: Checkout Android repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Step 2: Download libbox-merged artifact (with WebSocket fix)
      - name: Download libbox-merged artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-libbox-onering.yml
          name: libbox-merged
          path: libbox-download
          repo: shizukumiray-hue/sing-box-core-ref1nd
          run_id: ${{ inputs.core_run_id || '33263946919' }}
          allow_forks: true
        continue-on-error: true
      
      # Step 2.5: Verifikasi download artifact
      - name: Verifikasi download artifact
        run: |
          if [ ! -d "libbox-download" ] || [ -z "$(ls -A libbox-download 2>/dev/null)" ]; then
            echo "❌ GAGAL: Artifact tidak terunduh atau direktori kosong"
            echo "Mencoba mencari artifact lain..."
            exit 1
          fi
          echo "✓ Artifact berhasil diunduh"
          ls -lhR libbox-download/ | head -50
      
      # Step 3: Extract ZIP dan cari libbox.aar
      - name: Extract and locate libbox.aar from artifact
        run: |
          echo "=== Contents of libbox-download folder ==="
          ls -lh libbox-download/
          
          # Jika ada ZIP file, ekstrak
          if find libbox-download -name "*.zip" -type f | grep -q .; then
            echo "✓ Ditemukan ZIP file, melakukan ekstraksi..."
            for zipfile in libbox-download/*.zip; do
              unzip -o "$zipfile" -d libbox-download/
              echo "Extracted: $zipfile"
            done
          fi
          
          echo ""
          echo "=== Setelah ekstraksi ==="
          find libbox-download -type f -name "*.aar" -o -name "libbox*"
          
          # Cari libbox.aar di semua subdirectory
          if [ -f "libbox-download/libbox.aar" ]; then
            echo "✓ Found: libbox-download/libbox.aar"
          elif [ -f "libbox-download/libbox-merged/libbox.aar" ]; then
            echo "✓ Found in subdirectory, moving to root..."
            mv libbox-download/libbox-merged/libbox.aar libbox-download/
          else
            # Search recursively
            FOUND_AAR=$(find libbox-download -name "libbox.aar" -type f | head -1)
            if [ -n "$FOUND_AAR" ]; then
              echo "✓ Found at: $FOUND_AAR"
              cp "$FOUND_AAR" libbox-download/libbox.aar
            else
              echo "❌ ERROR: libbox.aar tidak ditemukan!"
              echo "Struktur direktori:"
              find libbox-download -type f | head -20
              exit 1
            fi
          fi
          
          echo ""
          echo "=== Final verification ==="
          ls -lh libbox-download/libbox.aar
      
      # Step 4: Verifikasi libbox.aar
      - name: Verify libbox.aar integrity
        run: |
          echo "=== AAR File Size ==="
          du -h libbox-download/libbox.aar
          
          echo ""
          echo "=== AAR File Structure ==="
          unzip -l libbox-download/libbox.aar | head -30
          
          echo ""
          echo "=== Native Libraries ==="
          unzip -l libbox-download/libbox.aar | grep -E "\.so$"
          
          echo ""
          echo "=== Extract and verify classes.jar ==="
          unzip -q libbox-download/libbox.aar classes.jar -d libbox-download/ || true
          
          if [ -f "libbox-download/classes.jar" ]; then
            echo "Top-level classes:"
            jar tf libbox-download/classes.jar | grep -E "^libbox/[A-Z].*\.class$" | sed 's/\.class$//' | sed 's/\$.*$//' | sort -u | head -30
            
            echo ""
            echo "=== Verify Critical Classes ==="
            jar tf libbox-download/classes.jar | grep -E "(Libbox\.class|OutboundGroup\.class|StatusMessage\.class|LogEntry\.class|LogIterator\.class)" && echo "✓ All critical classes found" || echo "⚠ Some classes missing"
          else
            echo "⚠ Could not extract classes.jar"
          fi
      
      # Step 5: Copy libbox.aar ke project
      - name: Copy libbox.aar to Android project
        run: |
          mkdir -p app/libs
          cp libbox-download/libbox.aar app/libs/
          echo "✓ libbox.aar copied to app/libs/"
          ls -lh app/libs/libbox.aar
      
      # Step 6: Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # Step 7: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      # Step 8: Setup NDK
      - name: Setup NDK for Android build
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.13004108" >> $GITHUB_ENV
      
      # Step 9: Setup Gradle
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          cache-read-only: true
          gradle-home-cache-cleanup: false
      
      # Step 10: Grant execute permission
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      # Step 11: Final verification
      - name: Final verification before build
        run: |
          echo "=== Verifying app/libs/libbox.aar before Gradle build ==="
          ls -lh app/libs/libbox.aar
          unzip -l app/libs/libbox.aar | grep classes.jar
          echo "✓ libbox.aar is ready for Gradle"
      
      # Step 12: Build APK
      - name: Build APK (Other variant - Release)
        run: ./gradlew assembleOtherRelease --stacktrace --no-daemon --no-build-cache
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      
      # Step 13: List built APKs
      - name: List built APKs
        run: |
          echo "Built APKs:"
          find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;
      
      # Step 14: Prepare and Standardize APK filenames
      - name: Prepare APK filenames
        run: |
          cd app/build/outputs/apk/other/release
          for f in *.apk; do
            if [[ "$f" == *"arm64-v8a"* ]]; then
              cp "$f" sing-box-arm64-v8a.apk
            elif [[ "$f" == *"armeabi-v7a"* ]]; then
              cp "$f" sing-box-armeabi-v7a.apk
            elif [[ "$f" == *"x86_64"* ]]; then
              cp "$f" sing-box-x86_64.apk
            elif [[ "$f" == *"x86"* ]]; then
              cp "$f" sing-box-x86.apk
            elif [[ "$f" == *"universal"* ]]; then
              cp "$f" sing-box-universal.apk
            fi
          done
          echo "Prepared APKs:"
          ls -lh sing-box-*.apk
      
      # Step 15: Sign APKs with apksigner
      - name: Sign APKs
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || '8JJR2x7QToMDMashiroDaisy' }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME || 'sing-box-onering' }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS || '8JJR2x7QToMDMashiroDaisy' }}
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          
          KEYSTORE_PATH="app/release.keystore"
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "$KEYSTORE_FILE" | base64 -d > app/release.keystore
          fi
          
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "❌ Keystore file not found at $KEYSTORE_PATH"
            exit 1
          fi
          
          cd app/build/outputs/apk/other/release
          for apk in sing-box-*.apk; do
            echo "=== Signing $apk ==="
            $APKSIGNER sign \
              --ks "../../../../../${KEYSTORE_PATH}" \
              --ks-key-alias "$ALIAS_NAME" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --key-pass "pass:$ALIAS_PASS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$apk"
            
            echo "=== Verifying signature for $apk ==="
            $APKSIGNER verify --verbose "$apk"
          done
          echo "✓ All APKs signed and verified successfully"
      
      # Step 16: Upload individual APK artifacts (separated per architecture)
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-arm64-v8a
          path: app/build/outputs/apk/other/release/sing-box-arm64-v8a.apk
          retention-days: 30
      
      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-armeabi-v7a
          path: app/build/outputs/apk/other/release/sing-box-armeabi-v7a.apk
          retention-days: 30
      
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-x86_64
          path: app/build/outputs/apk/other/release/sing-box-x86_64.apk
          retention-days: 30
      
      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-x86
          path: app/build/outputs/apk/other/release/sing-box-x86.apk
          retention-days: 30
      
      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-universal
          path: app/build/outputs/apk/other/release/sing-box-universal.apk
          retention-days: 30
      
      # Step 17: Upload libbox.aar for reference
      - name: Upload libbox.aar artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar-used
          path: app/libs/libbox.aar
          retention-days: 7
      
      # Step 18: Build Summary
      - name: Build Summary
        run: |
          echo "=== Build Summary ==="
          echo "✓ libbox.aar downloaded from artifacts"
          echo "✓ APK built and signed successfully"
          echo ""
          echo "Signed APKs:"
          ls -lh app/build/outputs/apk/other/release/sing-box-*.apk
